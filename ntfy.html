<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Abrir no ntfy</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17221c;
        background: #f4f7f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        padding: 40px 28px;
        border: 1px solid #dce5df;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 16px 45px rgb(23 34 28 / 10%);
        text-align: center;
      }

      h1 {
        margin: 0 0 28px;
        font-size: clamp(1.8rem, 8vw, 2.4rem);
      }

      a {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        padding: 14px 24px;
        border-radius: 12px;
        color: #fff;
        background: #338574;
        font-size: 1.05rem;
        font-weight: 700;
        text-decoration: none;
        transition: background 150ms ease, transform 150ms ease;
      }

      a:hover {
        background: #286b5d;
        transform: translateY(-1px);
      }

      a:focus-visible {
        outline: 3px solid #8cc9bc;
        outline-offset: 3px;
      }

      .erro {
        margin: 0;
        color: #a12622;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="saudacao">Olá</h1>
      <a id="abrir-ntfy" href="#">Abrir no ntfy</a>
      <p id="erro" class="erro" hidden></p>
    </main>

    <script>
      const parametros = new URLSearchParams(window.location.search);
      const topico = parametros.get("topico")?.trim();
      const display = parametros.get("display")?.trim();
      const saudacao = document.querySelector("#saudacao");
      const botao = document.querySelector("#abrir-ntfy");
      const erro = document.querySelector("#erro");

      if (topico && display) {
        saudacao.textContent = `Olá ${display}`;
        botao.href = `ntfy://ntfy.sh/${encodeURIComponent(topico)}?display=${encodeURIComponent(display)}`;
      } else {
        saudacao.textContent = "Link incompleto";
        botao.hidden = true;
        erro.hidden = false;
        erro.textContent = "Os parâmetros “topico” e “display” são obrigatórios.";
      }
    </script>
  </body>
</html>
